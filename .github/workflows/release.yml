name: "Plugin release"

on:
  push:
    tags:
       - '*'

jobs:
  bump-version:
    name: "Bump version"
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0 #To Fetch All Tags and Branches

      - name: Install Dependencies
        uses: php-actions/composer@v6
        with:
          dev: no

      - name: Extract Current Repo Name
        run: echo "repo_name=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV

      - name: "Extract Current Tag Name"
        run: echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Extract MIN GLPI VERSION
        run: echo "min_glpi_version=$(grep -oP 'define\("PLUGIN_TAG_MIN_GLPI", "\K[^"]+' setup.php)" >> $GITHUB_ENV

      - name: Extract MAX GLPI VERSION
        run: echo "max_glpi_version=$(grep -oP 'define\("PLUGIN_TAG_MAX_GLPI", "\K[^"]+' setup.php)" >> $GITHUB_ENV

      - name: Show env variables
        run: echo ${{ env }}

      - name: Run SUCCESS script
        run: echo Error


  create-release:
    name: "Create release"
    runs-on: "ubuntu-latest"
    if: ${{ always() && contains(join(needs.*.result, ','), 'success') }}
    needs: [bump-version]
    steps:
      - name: "Extract Current Tag Name"
        run: echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Build package"
        id: "build-package"
        uses: "glpi-project/tools/github-actions/build-package@0.7.1"
        with:
          plugin-version: ${{ env.tag_name }}

      - name: "Create release"
        id: "create-release"
        uses: "actions/create-release@v1"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.tag_name }}
          release_name: ${{ env.tag_name }}
          draft: true

      - name: "Attach package to release"
        uses: "actions/upload-release-asset@v1"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: ${{ steps.build-package.outputs.package-path }}
          asset_name: ${{ steps.build-package.outputs.package-basename }}
          asset_content_type: " application/x-bzip2"
